name: Weekly IT News Digest

on:
  schedule:
    - cron: '0 0 * * *'  # 毎朝 09:00 JST（UTC 0:00）
  workflow_dispatch: {}

permissions:
  contents: write  # posted_history.json / cost_log.json をコミット・pushするために必要

defaults:
  run:
    working-directory: SlackITnewsbot

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ADMIN_USER_ID: ${{ secrets.SLACK_ADMIN_USER_ID }}
          QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}
          # 社内承認済みのANTHROPIC_API_KEYがまだ無いため、Claude API呼び出しは
          # 一旦スキップし（SKIP_CLAUDE=1）、Slack投稿・履歴・コスト記録など
          # それ以外の疎通のみ確認する。ANTHROPIC_API_KEY登録が完了したら
          # SKIP_CLAUDEの行を削除すること
          DRY_RUN: '0'
          SKIP_CLAUDE: '1'
      - name: Commit updated posted_history.json / cost_log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json cost_log.json
          git diff --cached --quiet || git commit -m "chore: update posted_history.json / cost_log.json"
          git push

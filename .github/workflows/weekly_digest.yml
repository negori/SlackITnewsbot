name: Weekly IT News Digest

on:
  schedule:
    # TODO: cronのテスト実行が確認できたら '0 0 * * 1'（毎週月曜 09:00 JST）に戻すこと
    - cron: '15 16 * * 6'  # テスト用: 毎週日曜 01:15 JST（UTC土曜16:15）
  workflow_dispatch: {}

permissions:
  contents: write  # posted_history.json / cost_log.json をコミット・pushするために必要

defaults:
  run:
    working-directory: SlackITnewsbot

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ADMIN_USER_ID: ${{ secrets.SLACK_ADMIN_USER_ID }}
          QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}
          # TODO: cronのテスト実行が確認できたらDRY_RUN=1に戻し、SKIP_CLAUDEの行は削除すること
          DRY_RUN: '0'
          SKIP_CLAUDE: '1'  # テスト用: Claude APIを使わずダミー要約でSlack投稿だけ確認する
      - name: Commit updated posted_history.json / cost_log.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json cost_log.json
          git diff --cached --quiet || git commit -m "chore: update posted_history.json / cost_log.json"
          git push
